name: Improvement or new lab idea
description: A clearer explanation, a new exercise, a better plot twist
labels: [enhancement]
body:
  - type: input
    id: where
    attributes:
      label: Module and lab (or "new")
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should learners see or do, and what would it teach? A measurable result is ideal.
    validations:
      required: true
